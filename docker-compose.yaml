     # - ./rabbitMQ/rabbitmq.config:/etc/rabbitmq/rabbitmq.config:ro
      #- ./rabbitMQ:/etc/rabbitmq/conf.d
      #- ./rabbitMQ/definitions.json:/etc/rabbitmq/definitions.json
      #- ./rabbitMQ/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf

  artifactory:
    image: registry
    ports:
      - 5000:5000
    restart: always
    networks:
      - shared_network

  jenkins-agent:
    image: jenkins/ssh-agent:latest
    container_name: jenkins-agent
    environment:
      - JENKINS_AGENT_SSH_PUBKEY=ssh-rsa  test@test2
    restart: always
    volumes:
      - /usr/bin/docker:/usr/bin/docker
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - shared_network

  web:
    image: nginx:latest
    ports:
      - 8090:9000
    volumes:
      - ./my_conf:/etc/nginx/conf.d
    depends_on:
      - jenkins
    restart: always
    networks:
      - shared_network

volumes:
  jenkins_home:
  rabbitmq_data:
networks:
  shared_network:
    name: shared_network
